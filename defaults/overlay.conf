# The crossdev-stages portage overlay: ebuilds ::gentoo does not carry
# (app-arch/apk-tools, sys-apps/dnf5 and its deps, the opt-in SpaceMIT
# firmware ebuilds).  Its own repository, so this one stays Apache-2.0
# and carries no ebuilds.
#
# OVERLAY_REPO may instead be a path to a local clone, which is copied in
# as is; OVERLAY_TAG is then ignored.  Leave OVERLAY_REPO empty to build
# without the overlay (the alpine and fedora providers need it).
OVERLAY_REPO=https://github.com/OctopusET/crossdev-stages-overlay
OVERLAY_TAG=0f15f92b25a76c1cde363160a4490e04b948a0f2
