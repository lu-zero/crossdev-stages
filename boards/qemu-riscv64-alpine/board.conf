BOARD_NAME="qemu-riscv64-alpine"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

ROOTFS_PROVIDER="alpine"
# riscv64 is a supported Alpine architecture from 3.20 on.
ALPINE_BRANCH="v3.24"
# ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine"
# ALPINE_REPOS="main community"

# Mainline LTS; qemu -M virt boots the Image directly, no bootloader step.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_TAG="v6.12"
KERNEL_DEFCONFIG="defconfig"
BOOT_KERNEL_NAME="Image"

BOOT_HOSTNAME="alpine-riscv64"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"

# An `apk add alpine-base` root has the init scripts but empty runlevels;
# nothing but setup-alpine populates them, so the board says what starts.
# (The board.conf parser reads an array off one line.)
BOOT_SERVICES=("devfs:sysinit" "dmesg:sysinit" "mdev:sysinit" "hwdrivers:sysinit" "modules:boot" "sysctl:boot" "hostname:boot" "bootmisc:boot" "syslog:boot" "networking:boot" "seedrng:boot" "sshd:default" "local:default" "mount-ro:shutdown" "killprocs:shutdown" "savecache:shutdown")

BUILD_STEPS=(deps checkout kernel assemble pack)

IMAGE_NAME="alpine-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing")
DESCRIPTION="Alpine v3.24 rootfs + mainline kernel for qemu -M virt (ROOTFS_PROVIDER=alpine example)"
