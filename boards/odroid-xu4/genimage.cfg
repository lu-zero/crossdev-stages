config {
    outputpath = .
    inputpath = .
    rootpath = gen
    tmppath = tmp
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "rootfs"
        extraargs = "-i 4k"
    }

    size = 4G
    mountpoint = "/root"
}

image bootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "bootfs"
    }

    size = 256M
    mountpoint = "/boot"
}

image gentoo-linux-odroid-xu4_dev-sdcard.img {
    /* MBR, not GPT: the iROM reads BL1 from sector 1, exactly where a GPT
     * would keep its header and partition entries. */
    hdimage {
        partition-table-type = "mbr"
    }

    /* BL1 + BL2 + U-Boot + TrustZone monitor, sectors 1..2014, laid out by
     * post-bootloader.sh.  The U-Boot environment lives at 0x310000 (sector
     * 6272, 16 KiB) and is deliberately left blank. */
    partition exynos_boot {
        image = "exynos/sd-boot.bin"
        offset = "512"
        holes = {}
        in-partition-table = "false"
    }

    partition bootfs {
        image = "bootfs.ext4"
        offset = "8M"
        size = "256M"
        partition-type = 0x83
        bootable = true
        in-partition-table = "true"
    }

    partition rootfs {
        image = "rootfs.ext4"
        offset = "264M"
        size = ""
        partition-type = 0x83
        in-partition-table = "true"
    }
}
