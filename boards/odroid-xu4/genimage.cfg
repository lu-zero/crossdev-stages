config {
    outputpath = .
    inputpath = .
    rootpath = gen
    tmppath = tmp
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "rootfs"
        extraargs = "-i 4k"
    }

    size = 4G
    mountpoint = "/root"
}

image bootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "bootfs"
    }

    size = 256M
    mountpoint = "/boot"
}

image gentoo-linux-odroid-xu4_dev-sdcard.img {
    /* MBR, not GPT: the iROM reads BL1 from sector 1, exactly where a GPT
     * would keep its header and partition entries. */
    hdimage {
        partition-table-type = "mbr"
        /* Derived from the board and exported by the pack step; genimage
         * writes 0 when unset, which every other unsigned card also claims.
         * The kernel builds the PARTUUID as "%08x-%02x" from this and the
         * 1-based slot (block/partitions/msdos.c). */
        disk-signature = "${BOOT_DISK_SIG}"
    }

    /* BL1 + BL2 + U-Boot + TrustZone monitor, sectors 1..2014, laid out by
     * post-bootloader.sh.  Starts at 512 so it clears the MBR.
     *
     * bootfs cannot move down to the vendor's 1 MiB: mainline
     * odroid-xu3_defconfig puts the U-Boot environment at CONFIG_ENV_OFFSET
     * 0x310000 with CONFIG_ENV_SIZE 0x4000, i.e. 3.2 MiB, so a single saveenv
     * would land inside the filesystem.  The vendor keeps its environment at
     * sector 2015 instead and does not have this constraint. */
    partition exynos_boot {
        image = "exynos/sd-boot.bin"
        offset = "512"
        in-partition-table = "false"
    }

    partition bootfs {
        image = "bootfs.ext4"
        offset = "8M"
        size = "256M"
        partition-type = 0x83
        bootable = true
        in-partition-table = "true"
    }

    partition rootfs {
        image = "rootfs.ext4"
        offset = "264M"
        size = ""
        partition-type = 0x83
        in-partition-table = "true"
    }
}
