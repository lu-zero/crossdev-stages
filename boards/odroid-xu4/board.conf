TESTING="true"

BOARD_NAME="odroid-xu4"
BOARD_ARCH="armv7a"
# Exynos 5422 pairs a Cortex-A15 cluster with a Cortex-A7 cluster.  GCC gives
# both the same ISA (armv7ve+simd in arm-cpus.in), so there is no lowest common
# denominator to fall back to: build for armv7ve and only schedule for the A7.
#
# -mfpu is not optional here.  Gentoo's toolchain.eclass configures gcc for an
# armv7*-gnueabihf CTARGET with --with-fpu=vfpv3-d16, and that default is only
# suppressed by an explicit -mfpu= on the command line.  Without this the whole
# system builds without NEON even though -march says +simd.
BOARD_CFLAGS="-O2 -march=armv7ve -mtune=cortex-a15.cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard -pipe"
CROSS_COMPILE="armv7a-unknown-linux-gnueabihf-"
KERNEL_ARCH="arm"

# Mainline kernel.  exynos_defconfig covers everything on this board: exynos-drm
# (FIMD/mixer/HDMI), panfrost for the Mali-T628, dwc3 USB3, USB_RTL8152 for the
# on-board gigabit NIC, dw_mmc for eMMC and SD, the TMU thermal sensors with
# cpufreq-dt cooling, pwm-fan, and the S3C watchdog.  multi_v7_defconfig also
# boots but is a much larger kernel for no gain on a single-board target.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
KERNEL_TAG="v7.2"
KERNEL_DEFCONFIG="exynos_defconfig"

# Mainline U-Boot.  There is no odroid-xu4 defconfig: odroid-xu3_defconfig
# covers XU3/XU3-Lite/XU4/HC1/HC2 and identifies itself as such.
U_BOOT_REPO="https://github.com/u-boot/u-boot.git"
U_BOOT_TAG="v2026.07"
U_BOOT_DEFCONFIG="odroid-xu3_defconfig"

# Samsung-signed boot chain: iROM -> BL1 -> BL2 -> TrustZone SW -> U-Boot.
# BL1, BL2 and the TrustZone monitor have no public source and are verified by
# the iROM, so they can only be copied from Hardkernel's tree.  U-Boot itself is
# built from mainline above; these three are the only vendor pieces.
EXYNOS_BLOB_REPO="https://github.com/hardkernel/u-boot.git"
EXYNOS_BLOB_TAG="odroidxu4-v2017.05"

# BOOT_PIPELINE is just U-Boot; post-checkout.sh fetches the signed blobs and
# post-bootloader.sh lays them out into a single raw region for genimage.
BOOT_PIPELINE=("uboot")

BOARD_DTB_GLOB="arch/arm/boot/dts/samsung/exynos5422-odroidxu4.dtb"

# Boot.  eMMC is mmc_0 and holds the "mmc0" DT alias, so the SD slot (mmc_2,
# unaliased) always lands on mmcblk1 whether or not an eMMC module is fitted.
# Debug UART is the 4-pin header, serial@12C20000 = ttySAC2.
BOOT_ROOT_DEV="/dev/mmcblk1p2"
BOOT_CONSOLE="ttySAC2,115200n8"
BOOT_KERNEL_NAME="zImage"

BUILD_STEPS=(deps checkout bootloader kernel assemble pack)

BOOT_SERVICES=("sshd:default" "metalog:default" "ntp-client:default")
BOOT_HOSTNAME="gentoo"
BOOT_SERIAL_TTY="ttySAC2"
BOOT_SERIAL_BAUD="115200"
