TESTING="true"

BOARD_NAME="orangepi-5-ultra"
BOARD_ARCH="aarch64"
BOARD_CFLAGS="-O3 -mcpu=cortex-a76.cortex-a55+crc+crypto -pipe"
CROSS_COMPILE="aarch64-unknown-linux-gnu-"
KERNEL_ARCH="arm64"

# Mainline sources only.  RK3588 needs no vendor tree any more: the board DT
# (including the three NPU cores), panthor for the Mali G610, the vdpu381
# video decoder and the rocket NPU driver are all in torvalds/linux.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
KERNEL_TAG="v7.2"
KERNEL_DEFCONFIG="defconfig"

U_BOOT_REPO="https://github.com/u-boot/u-boot.git"
U_BOOT_TAG="v2026.07"
U_BOOT_DEFCONFIG="orangepi-5-ultra-rk3588_defconfig"

# ARM Trusted Firmware (BL31)
TFA_REPO="https://github.com/ARM-software/arm-trusted-firmware.git"
TFA_TAG="lts-v2.14.6"
TFA_PLAT="rk3588"

# Firmware from upstream linux-firmware, copied with paths preserved.
# One directory per part actually on the board:
#   arm/mali  Mali-G610, arm,mali-valhall-csf; panthor needs it to probe
#   rtl_nic   Realtek NIC behind pcie2x1l1 (r8169 requests rtl_nic/rtl81*.fw)
# Not here: the AP6611S. Its Bluetooth patch (BCM4362A2.hcd) is not one of the
# two .hcd files linux-firmware ships, and its Wi-Fi has no mainline driver at
# all. See the board README.
# Add a directory here for anything plugged into USB or M.2.
FIRMWARE_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git"
FIRMWARE_TAG="20260810"
FIRMWARE_DIRS=("arm/mali" "rtl_nic")

# Rockchip DDR init blob, the only closed-source piece of the boot chain.
RKBIN_REPO="https://github.com/rockchip-linux/rkbin.git"
# Exact file, not a glob.  The same directory carries an eyescan build, which
# is a diagnostic blob, and rkbin only ever adds files -- so a glob plus
# "newest wins" silently changes what boots as soon as upstream pushes.
RKBIN_DDR="bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.21.bin"

# Build order: DDR blob -> BL31 -> U-Boot (consumes both via env exports).
BOOT_PIPELINE=("rkbin" "tfa" "uboot")

BOARD_DTB_GLOB="arch/arm64/boot/dts/rockchip/rk3588-orangepi-5-ultra.dtb"

# Boot.  SD card is mmcblk1 (eMMC on sdhci takes mmcblk0), debug UART is
# uart2m0 on the 3-pin header at the RK3588 default 1.5 Mbaud.
# rootfs is p2, named by the GPT partition UUID that genimage.cfg stamps in,
# so one card boots from the SD slot, eMMC or NVMe without an edit.  The
# vendor's root=UUID= form is not an option: without an initramfs the kernel
# understands only PARTUUID=, PARTLABEL= and /dev/ (block/early-lookup.c).
BOOT_ROOT_DEV="PARTUUID=${BOOT_PART_UUID_2}"
BOOT_CONSOLE="ttyS2,1500000"
BOOT_KERNEL_NAME="Image"

# U-Boot reads /extlinux/extlinux.conf off the boot partition; assemble writes
# it.  cma= is for the HDMI-RX capture buffers, which come out of CMA.
BOOT_EXTLINUX="true"
BOOT_APPEND="earlycon cma=256M"

# ntpd, not ntp-client: ntp-client is a one-shot ntpdate that runs before
# dhcpcd has a lease, fails name resolution and leaves the clock at the epoch.
BOOT_SERVICES=("sshd:default" "metalog:default" "ntpd:default" "seatd:default")
BOOT_SERIAL_TTY="ttyS2"
BOOT_SERIAL_BAUD="1500000"

# Both media, and measured rather than assumed: the Rockchip BootROM reads
# idbloader at LBA 64 and u-boot.itb at LBA 16384 on the SD card and on the
# eMMC user area alike, and root= is a PARTUUID, so one file covers both.
IMAGE_NAME="gentoo-linux-orangepi-5-ultra_dev-sdcard-emmc.img"
