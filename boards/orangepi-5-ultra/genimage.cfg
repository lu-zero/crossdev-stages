config {
    outputpath = .
    inputpath = .
    rootpath = gen
    tmppath = tmp
}

image rootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "rootfs"
        extraargs = "-i 4k"
    }

    size = 6G
    mountpoint = "/root"
}

image bootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "bootfs"
    }

    size = 256M
    mountpoint = "/boot"
}

image gentoo-linux-orangepi-5-ultra_dev-sdcard-emmc.img {
    hdimage {
        partition-table-type = "gpt"
        /* Derived from the board by the pack step.  Left unset, genimage
         * draws these at random per build, which makes a PARTUUID root=
         * impossible and the image unreproducible. */
        disk-uuid = "${BOOT_DISK_UUID}"
    }

    /* idbloader.img at sector 64 (32KB) */
    partition idbloader {
        image = "u-boot/idbloader.img"
        offset = "32K"
        size = "4M"
        in-partition-table = "false"
    }

    /* u-boot.itb at sector 16384 (8MB) */
    partition uboot {
        image = "u-boot/u-boot.itb"
        offset = "8M"
        size = "4M"
        in-partition-table = "false"
    }

    partition bootfs {
        image = "bootfs.ext4"
        offset = "16M"
        size = "256M"
        /* Plain Linux data, not "linux".  This is an ext4 filesystem read by
         * U-Boot's sysboot; the vendor image has no ESP either, and claiming
         * the EFI type for an ext4 partition is simply untrue. */
        partition-type-uuid = "linux"
        partition-uuid = "${BOOT_PART_UUID_1}"
        in-partition-table = "true"
    }

    partition rootfs {
        image = "rootfs.ext4"
        offset = "272M"
        size = ""
        partition-type-uuid = "root-arm64"
        partition-uuid = "${BOOT_PART_UUID_2}"
        in-partition-table = "true"
    }
}
