# Appended to the image's own /etc/portage/make.conf at assemble time.
# Portage takes the last assignment, so anything here overrides what the
# shared target stage carries.

# Eight cores, and 16 GB is not enough to let sixteen link jobs run at once.
MAKEOPTS="-j8 -l8"
EMERGE_DEFAULT_OPTS="--jobs=4 --load-average 8"

# Mali-G610: panfrost for GL, panvk for Vulkan.  Both come from mesa.
VIDEO_CARDS="panfrost"

# No X server on this board.  zink puts GL on top of panvk, which is the
# path that gets hardware acceleration under a wlroots compositor.
USE="-X wayland vulkan zink alsa pipewire screencast"

LC_MESSAGES=C.UTF-8
GENTOO_MIRRORS="https://mirror.krfoss.org/gentoo https://distfiles.gentoo.org"
