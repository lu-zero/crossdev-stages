TAGS=("testing")

INCLUDE="rk35xx"
BOARD_NAME="odroid-m1s"
TAGS=("aarch64" "rockchip" "rk3566" "odroid" "testing")
BOARD_CFLAGS="-O3 -mcpu=cortex-a55+crc+crypto -pipe"

U_BOOT_DEFCONFIG="odroid-m1s-rk3566_defconfig"
# TF-A has no rk3566 platform; the RK3566 runs the rk3568 BL31.
TFA_PLAT="rk3568"
# Exact file, not a glob.  rkbin only ever adds files, so a glob plus
# "newest wins" changes what boots as soon as upstream pushes.
RKBIN_DDR="bin/rk35/rk3566_ddr_1056MHz_v1.25.bin"
BOARD_DTB_GLOB="arch/arm64/boot/dts/rockchip/rk3566-odroid-m1s.dtb"

# The eMMC, not a card.  See odroid-m1.
# rootfs is p2, named by the GPT partition UUID that genimage.cfg stamps in.
# The kernel resolves PARTUUID= without an initramfs; UUID= it does not
# (block/early-lookup.c).
BOOT_ROOT_DEV="PARTUUID=${BOOT_PART_UUID_2}"

IMAGE_NAME="gentoo-linux-odroid-m1s_dev-emmc.img"
