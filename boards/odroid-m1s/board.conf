TAGS=("testing")

BOARD_NAME="odroid-m1s"
BOARD_ARCH="aarch64"
BOARD_CFLAGS="-O3 -mcpu=cortex-a55+crc+crypto -pipe"
CROSS_COMPILE="aarch64-unknown-linux-gnu-"
KERNEL_ARCH="arm64"

# Mainline sources
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
KERNEL_TAG="v7.0"
KERNEL_DEFCONFIG="defconfig"

U_BOOT_REPO="https://github.com/u-boot/u-boot.git"
U_BOOT_TAG="v2026.04"
U_BOOT_DEFCONFIG="odroid-m1s-rk3566_defconfig"

# ARM Trusted Firmware (BL31) — RK3566 shares the rk3568 TFA platform
TFA_REPO="https://github.com/ARM-software/arm-trusted-firmware.git"
TFA_TAG="lts-v2.14.1"
TFA_PLAT="rk3568"

# Rockchip DDR init blob (closed-source, required)
# RK3566 has its own DDR blob, distinct from RK3568
RKBIN_REPO="https://github.com/rockchip-linux/rkbin.git"
# Exact file, not a glob.  rkbin only ever adds files, so a glob plus
# "newest wins" changes what boots as soon as upstream pushes -- and the
# rk3588 directory carries an eyescan build, which is a diagnostic blob.
RKBIN_DDR="bin/rk35/rk3566_ddr_1056MHz_v1.25.bin"

BOARD_DTB_GLOB="arch/arm64/boot/dts/rockchip/rk3566-odroid-m1s.dtb"

# Boot
# rootfs is p2, named by the GPT partition UUID that genimage.cfg stamps
# in, so the image no longer depends on the eMMC enumerating the way it
# did when this was written.  The kernel resolves PARTUUID= without an
# initramfs; UUID= it does not (block/early-lookup.c).
BOOT_ROOT_DEV="PARTUUID=${BOOT_PART_UUID_2}"
BOOT_CONSOLE="ttyS2,1500000"
BOOT_KERNEL_NAME="Image"

BUILD_STEPS=(deps checkout bootloader kernel assemble pack)

BOOT_SERVICES=("sshd:default" "metalog:default" "ntp-client:default")
BOOT_HOSTNAME="gentoo"
BOOT_SERIAL_TTY="ttyS2"
BOOT_SERIAL_BAUD="1500000"

# The eMMC, not a card.  See odroid-m1: mmc0 is the non-removable
# controller and BOOT_ROOT_DEV roots mmcblk0.
IMAGE_NAME="gentoo-linux-odroid-m1s_dev-emmc.img"
