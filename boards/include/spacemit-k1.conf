# SpacemiT K1 / X1.  What the K1 boards repeat: the toolchain, the OpenSBI
# fork the SoC needs, the vendor firmware overlay and the debug console.
#
# Pulled in with INCLUDE="spacemit-k1".  A board.conf is read after this and
# the last assignment wins, so a board states only what is its own -- its
# vendor tag, its U-Boot and kernel trees, its DTBs, where its rootfs is.

BOARD_ARCH="riscv64"
BOARD_CFLAGS="-O3 -march=rv64gcv_zvl256b -pipe"
SYSROOT="rv64gcv_zvl256b"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

# The K1 needs cyyself's OpenSBI fork; mainline generic does not bring this
# SoC up.  U-Boot is chain-loaded from it, so those two are the whole pipeline.
OPENSBI_REPO="https://github.com/cyyself/opensbi"
OPENSBI_TAG="k1-opensbi"
OPENSBI_PLATFORM="generic"
OPENSBI_MAKE_FLAGS="PLATFORM_DEFCONFIG=defconfig"
BOOT_PIPELINE=("opensbi" "uboot")

# The vendor buildroot tree, cloned at the board's own TAG.  Its overlay path
# ends in lib/firmware, so the contents land in /lib/firmware: esos.elf for the
# auxiliary core, and rtw89/ rtl_bt/ aic/ for the radios.
FIRMWARE_REPO="https://gitee.com/bianbu-linux/buildroot-ext.git"
BOARD_FIRMWARE_OVERLAY="board/spacemit/k1/target_overlay/lib/firmware"
DRACUT_MODULES="busybox"

BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_BAUD="115200"
BOOT_SERVICES=("sshd:default" "metalog:default" "ntp-client:default")
