# Rockchip RK35xx.  Everything a board on this SoC repeats: the toolchain, the
# sources to build, the boot pipeline and the debug console.
#
# Pulled in with INCLUDE="rk35xx".  A board.conf is read after this, and the
# last assignment wins, so a board states only what is actually its own -- its
# DDR blob, its U-Boot defconfig, its DTB.

BOARD_ARCH="aarch64"
CROSS_COMPILE="aarch64-unknown-linux-gnu-"
KERNEL_ARCH="arm64"

KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"
KERNEL_TAG="v7.0"
KERNEL_DEFCONFIG="defconfig"

U_BOOT_REPO="https://github.com/u-boot/u-boot.git"
U_BOOT_TAG="v2026.04"

TFA_REPO="https://github.com/ARM-software/arm-trusted-firmware.git"
TFA_TAG="lts-v2.14.1"

RKBIN_REPO="https://github.com/rockchip-linux/rkbin.git"

# The BootROM reads idbloader at 32K and u-boot.itb at 8M, so rkbin runs first
# to produce the DDR init, then TF-A for BL31, then U-Boot packs both.
BOOT_PIPELINE=("rkbin" "tfa" "uboot")

# uart2m0 at 1500000 is the RK35xx debug header across every board here.
BOOT_CONSOLE="ttyS2,1500000"
BOOT_SERIAL_TTY="ttyS2"
BOOT_SERIAL_BAUD="1500000"
BOOT_KERNEL_NAME="Image"

BOOT_SERVICES=("sshd:default" "metalog:default" "ntp-client:default")
