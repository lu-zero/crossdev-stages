BOARD_NAME="qemu-riscv64-ubuntu"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

ROOTFS_PROVIDER="ubuntu"
# Ubuntu has no rolling alias, so the suite is always a codename.
UBUNTU_SUITE="noble"
# Default for every arch but amd64/i386: http://ports.ubuntu.com/ubuntu-ports
# UBUNTU_MIRROR="http://ports.ubuntu.com/ubuntu-ports"

# Opt-in: stop after debootstrap stage 1 and finish the bootstrap on the
# board at first boot.  Needs no qemu-user binfmt on the build host, and
# costs a bigger image and a slow, fragile first boot.  Drop this line for
# the default, where the second stage runs in a chroot at build time and
# the image ships finished.
ROOTFS_SECOND_STAGE="first-boot"

# Mainline LTS; qemu -M virt boots the Image directly, no bootloader step.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_TAG="v6.12"
KERNEL_DEFCONFIG="defconfig"
BOOT_KERNEL_NAME="Image"

BOOT_ROOT_DEV="/dev/vda"
BOOT_HOSTNAME="ubuntu-riscv64"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"

BUILD_STEPS=(deps checkout kernel assemble pack)

IMAGE_NAME="ubuntu-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing")
DESCRIPTION="Ubuntu noble rootfs + mainline kernel for qemu -M virt (ROOTFS_PROVIDER=ubuntu, deferred second stage)"
