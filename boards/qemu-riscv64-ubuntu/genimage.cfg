config {
    outputpath = .
    inputpath = .
    rootpath = gen
    tmppath = tmp
}

image ubuntu-linux-qemu-riscv64-rootfs.ext4 {
    ext4 {
        use-mke2fs = "true"
        label = "rootfs"
    }

    # 6G, not the debian board's 4G: with ROOTFS_SECOND_STAGE="first-boot"
    # the rootfs also carries every .deb until the first boot runs
    # apt-get clean.
    size = 6G
    mountpoint = "/root"
}
