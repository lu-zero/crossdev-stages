BOARD_NAME="pentium-mmx"
TAGS=("x86" "i586" "testing")
BOARD_ARCH="i586"
BOARD_CFLAGS="-march=pentium-mmx -O2 -pipe"
SYSROOT="pentium-mmx"
CROSS_COMPILE="i586-pc-linux-gnu-"
KERNEL_ARCH="x86"

# Intel Pentium MMX (P55C, 1997)
# i586 class, MMX SIMD, no SSE
# BIOS boot - no u-boot, no opensbi
# GRUB i386-pc: core.img embedded in MBR gap, grub.cfg on FAT boot partition
GRUB_PLATFORMS="pc"

KERNEL_REPO="https://github.com/torvalds/linux.git"
KERNEL_TAG="v6.18"
KERNEL_DEFCONFIG="i386_defconfig"

BOOT_HOSTNAME="gentoo-pentium-mmx"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"
# rootfs is partition 2, named by the MBR PARTUUID rather than /dev/sda2.
# The kernel has no LABEL= case at all (block/early-lookup.c takes only
# PARTUUID=, PARTLABEL=, /dev/ and a raw device number) and there is no
# initramfs here to resolve one.  PARTUUID over /dev/sda2 because the
# disk is sda only while it is master on the first ATA channel.
# BOOT_DISK_ID is exported before this file is sourced, genimage.cfg
# stamps the matching disk-signature, and the kernel spells the pair
# "{sig}-02" itself (block/partitions/msdos.c).
BOOT_ROOT_DEV="PARTUUID=${BOOT_DISK_ID}-02"
BOOT_KERNEL_NAME="bzImage"

BOOT_SERVICES=("sshd:default" "dhcpcd:default")

TAGS=("testing")
