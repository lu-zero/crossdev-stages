BOARD_NAME="qemu-riscv64-fedora"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

ROOTFS_PROVIDER="fedora"
# Fedora 44.  riscv64 is not a Fedora release architecture; the RISC-V
# SIG composes it separately and publishes under /alt, which the
# provider knows about.  Only pinned releases are accepted.
FEDORA_RELEASE="44"
# FEDORA_MIRROR="https://dl.fedoraproject.org/pub"

# Mainline LTS; qemu -M virt boots the Image directly, no bootloader step.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_TAG="v6.12"
KERNEL_DEFCONFIG="defconfig"
BOOT_KERNEL_NAME="Image"

BOOT_HOSTNAME="fedora-riscv64"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"

# No BOOT_SERVICES: Fedora is a systemd distro, and the provider warns
# that the key is OpenRC-only.

BUILD_STEPS=(deps checkout kernel assemble pack)

IMAGE_NAME="fedora-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing")
DESCRIPTION="Fedora 44 container base rootfs + mainline kernel for qemu -M virt (ROOTFS_PROVIDER=fedora example)"
