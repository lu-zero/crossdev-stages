TAGS=("testing")

INCLUDE="rk35xx"
BOARD_NAME="odroid-m2"
BOARD_CFLAGS="-O3 -mcpu=cortex-a76.cortex-a55+crc+crypto -pipe"

U_BOOT_DEFCONFIG="odroid-m2-rk3588s_defconfig"
TFA_PLAT="rk3588"
# Exact file, not a glob.  rkbin only ever adds files, so a glob plus
# "newest wins" changes what boots as soon as upstream pushes.
RKBIN_DDR="bin/rk35/rk3588_ddr_lp4_2112MHz_lp5_2400MHz_v1.21.bin"
BOARD_DTB_GLOB="arch/arm64/boot/dts/rockchip/rk3588s-odroid-m2.dtb"

# rootfs is p2, named by the GPT partition UUID that genimage.cfg stamps in.
# The kernel resolves PARTUUID= without an initramfs; UUID= it does not
# (block/early-lookup.c).
BOOT_ROOT_DEV="PARTUUID=${BOOT_PART_UUID_2}"

IMAGE_NAME="gentoo-linux-odroid-m2_dev-sdcard.img"
