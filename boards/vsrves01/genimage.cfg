config {
    outputpath = .
    inputpath = .
    rootpath = gen
    tmppath = tmp
}

# Superfloppy FAT16 — no MBR/GPT.  VSDSP6 boot ROM reads sector 0 as FAT
# BPB.  Vendor's own driver was developed against FAT16 (see Card-stuck
# failure when given FAT32 on an SDSC card), so we match.
#
# Phram-rootfs architecture: linux61.vri is the bare kernel (~6.4 MiB,
# no cpio embed) and image.sqfs (lz4, ~72 MiB) sits next to it on the
# FAT — DDRLoad loads both to DDR at boot.  200 MiB leaves headroom for
# both plus the vendor VSOS payloads; a 256 MB SDSC card has ~244 MiB
# usable.  image.sqfs must stay under the 80 MiB phram window.
image gentoo-linux-vsrves01_dev-sdcard.img {
    vfat {
        extraargs = "-F 16"
        label = "VSRV-LINUX"
    }
    size = 200M
    mountpoint = "/boot"
}
