BOARD_NAME="qemu-riscv64-openwrt"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

ROOTFS_PROVIDER="openwrt"
OPENWRT_RELEASE="25.12.5"
OPENWRT_TARGET="sifiveu"
OPENWRT_SUBTARGET="generic"
OPENWRT_PROFILE="sifive_unmatched"
# sha256 of openwrt-imagebuilder-25.12.5-sifiveu-generic.Linux-x86_64.tar.zst
# as published in that release directory's sha256sums.  Checked before the
# tarball is unpacked; everything apk then pulls from the feeds is signed
# with the keys inside it.
OPENWRT_SHA256="6b00a1d4bf409ed2196d01c64fca525331c5df66c9fe52ce04040d8914e0ca98"
# OPENWRT_MIRROR="https://downloads.openwrt.org"

# Mainline; qemu -M virt boots the Image directly, no bootloader step.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_TAG="v7.2"
KERNEL_DEFCONFIG="defconfig"
BOOT_KERNEL_NAME="Image"

BOOT_HOSTNAME="openwrt-riscv64"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"

BUILD_STEPS=(deps checkout kernel assemble pack)

IMAGE_NAME="openwrt-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing")
DESCRIPTION="OpenWrt 25.12.5 riscv64 rootfs + mainline kernel for qemu -M virt (ROOTFS_PROVIDER=openwrt example)"
