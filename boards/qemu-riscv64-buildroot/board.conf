BOARD_NAME="qemu-riscv64-buildroot"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"

ROOTFS_PROVIDER="buildroot"
# A name in buildroot's own configs/; a file of this name in this
# directory would win instead.
BUILDROOT_DEFCONFIG="qemu_riscv64_virt_defconfig"
BUILDROOT_TAG="2026.05.2"
# BUILDROOT_REPO="https://gitlab.com/buildroot.org/buildroot.git"

# No kernel, no bootloader, no crossdev: the defconfig builds all three.
# BUILD_STEPS is what picks that; adding checkout/kernel back would build
# a second toolchain to build a second kernel.
BUILD_STEPS=(deps assemble pack)

# Required fields with nothing behind them here, see README.
KERNEL_REPO=""
KERNEL_DEFCONFIG=""
# Read out of buildroot's output/images/ rather than a kernel tree.
BOOT_KERNEL_NAME="Image"

IMAGE_NAME="buildroot-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing" "riscv64")
DESCRIPTION="Buildroot rootfs + kernel for qemu -M virt (ROOTFS_PROVIDER=buildroot example)"
