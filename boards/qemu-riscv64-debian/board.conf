BOARD_NAME="qemu-riscv64-debian"
BOARD_ARCH="riscv64"
CROSS_COMPILE="riscv64-unknown-linux-gnu-"
KERNEL_ARCH="riscv"

ROOTFS_PROVIDER="debian"
DEBIAN_SUITE="trixie"
# DEBIAN_MIRROR="http://deb.debian.org/debian"
# Default: the second stage runs in a chroot at build time, so the image
# ships finished.  "first-boot" defers it to the board and needs no
# qemu-user binfmt; see boards/qemu-riscv64-ubuntu for what that costs.
# ROOTFS_SECOND_STAGE="chroot"

# Mainline LTS; qemu -M virt boots the Image directly, no bootloader step.
KERNEL_REPO="https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git"
KERNEL_TAG="v6.12"
KERNEL_DEFCONFIG="defconfig"
BOOT_KERNEL_NAME="Image"

BOOT_ROOT_DEV="/dev/vda"
BOOT_HOSTNAME="debian-riscv64"
BOOT_CONSOLE="ttyS0,115200"
BOOT_SERIAL_TTY="ttyS0"
BOOT_SERIAL_BAUD="115200"

BUILD_STEPS=(deps checkout kernel assemble pack)

IMAGE_NAME="debian-linux-qemu-riscv64-rootfs.ext4"
TAGS=("example" "testing")
DESCRIPTION="Debian trixie rootfs + mainline kernel for qemu -M virt (ROOTFS_PROVIDER=debian example)"
